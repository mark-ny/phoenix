[package]
name = "phoenix-workstation"
version = "0.2.2"
description = "Project Phoenix authorized device-servicing workstation"
authors = ["Project Phoenix contributors"]
edition = "2021"

[lib]
name = "phoenix_workstation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
dirs = "6"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
tauri-plugin-updater = "^2"
